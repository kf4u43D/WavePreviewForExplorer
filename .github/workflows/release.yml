name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        shell: pwsh
        run: cmake --build build --config Release

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts\package-installer.ps1 -Configuration Release -NoBuild

      - name: Archive package
        shell: pwsh
        run: |
          $packageDir = "dist\AudioPreviewForExplorer-Release"
          $zipPath = "dist\AudioPreviewForExplorer-${{ github.ref_name }}.zip"
          Compress-Archive -Path "$packageDir\*" -DestinationPath $zipPath -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/AudioPreviewForExplorer-${{ github.ref_name }}.zip
